name: Submit an entry
description: Suggest a demo, workflow, tool or agent built on T3N, or a Learn resource on building safe agentic systems.
title: "Add: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! A maintainer will turn this into a pull request. Prefer to open the pull request yourself? See CONTRIBUTING.md in the repo root.
  - type: input
    id: name
    attributes: { label: Name, placeholder: Payslip Checker }
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Link
      description: A public GitHub repo is checked for T3N automatically. Docs or product pages are reviewed by a maintainer.
      placeholder: "https://github.com/you/your-repo"
    validations: { required: true }
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Demo, Workflow, Tool, Agent, Learn]
    validations: { required: true }
  - type: input
    id: provider
    attributes: { label: Built by (optional), description: Person or company behind it. }
  - type: dropdown
    id: business_function
    attributes:
      label: Business function
      description: Required for agents. Matches the Agent Directory's categories.
      options: [Payroll & HR, Finance & Payments, Customer Support, Healthcare, Insurance, Travel & Expense, Identity & KYC, Legal & Compliance, Others]
  - type: textarea
    id: pain
    attributes: { label: Business problem it solves (optional), description: One or two sentences. Max 500 characters. }
  - type: input
    id: repo
    attributes:
      label: Source code (optional)
      description: The public GitHub repo, if the Link above isn't one. It's what gets checked for T3N.
      placeholder: "https://github.com/you/your-repo"
  - type: textarea
    id: summary
    attributes:
      label: One-sentence summary
      description: Lead with what the agent can do safely. Max 200 characters.
    validations: { required: true }
  - type: checkboxes
    id: pillars
    attributes:
      label: Security controls it demonstrates
      options:
        - label: identity
        - label: delegation
        - label: privacy
        - label: spend-control
        - label: egress-control
        - label: human-in-loop
        - label: audit
        - label: credentials
  - type: checkboxes
    id: works_with
    attributes:
      label: Works with (optional)
      description: AIs that can use it today. Ticking any makes a workflow or tool a Skill on the Agent Directory.
      options:
        - label: Any agent built on T3 Network
        - label: Claude
        - label: ChatGPT
        - label: Gemini
        - label: Muse
        - label: Copilot
  - type: input
    id: mcp_url
    attributes:
      label: MCP server URL (optional)
      description: Lets people add it to Claude, ChatGPT and other AIs. You host and run this server; the list only links to it.
      placeholder: "https://mcp.example.com/your-skill"
  - type: input
    id: mcp_source
    attributes:
      label: MCP server source code (optional)
      description: Where reviewers can read the server's code. Strongly recommended; see CONTRIBUTING.md.
  - type: input
    id: uses
    attributes:
      label: Shows these entries (demos only)
      description: Ids of the listed entries this demo uses, comma-separated, e.g. z-tenant-flight, private-doc-scanner.
  - type: input
    id: license
    attributes: { label: License (optional), description: "SPDX id if open source (e.g. MIT, Apache-2.0), or Proprietary." }
  - type: input
    id: demo
    attributes: { label: Demo link (video, GIF or live URL), description: Required for demos. }
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: Developers can try it or learn from it (public repo, docs, demo or product page).
          required: true
        - label: It's built with T3N, or it's a Learn resource.
          required: true
