# Contributors only add YAML. After merge, this regenerates the README block and commits it.
# With a ruleset on main, the push must be allowed through: on a personal repo, add a write deploy
# key as the README_DEPLOY_KEY secret and put "Deploy keys" on the bypass list; on an org repo,
# bypass the GitHub Actions app instead and leave the secret unset.
name: Rebuild README
on:
  push:
    branches: [main]
    paths: ["registry/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.README_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit README if it changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild README from registry" README.md
          git push
