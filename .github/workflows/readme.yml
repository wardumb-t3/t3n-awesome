# Contributors only add YAML. After merge, this regenerates the README block and commits it.
# The GitHub Actions bot must be allowed to push to main (branch protection bypass).
name: Rebuild README
on:
  push:
    branches: [main]
    paths: ["registry/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit README if it changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild README from registry" README.md
          git push
