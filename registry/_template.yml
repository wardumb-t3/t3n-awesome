# Copy to registry/<folder>/<id>.yml (folders: demos, workflows, tools, agents, learn). Everything except Learn must be built on T3N.
# The file name must equal `id`. Delete the optional lines you don't use.
# Field reference: registry/schema.json

id: my-entry                      # lowercase-with-dashes
name: My Entry
type: workflow                    # demo | workflow | tool | agent | learn
summary: One sentence that leads with what the agent can do safely, not with adjectives.
url: https://github.com/you/your-repo   # repo, docs or product page
demo_url: null                    # optional: video, GIF or live URL (required for demos)
pillars: [privacy]                # identity | delegation | privacy | spend-control | egress-control | human-in-loop | audit | credentials
stack: [rust, wasm]
works_with: [any-t3n-agent]       # optional: AIs that can use it (any-t3n-agent | claude | chatgpt | gemini | muse | copilot); makes it a Skill on the Agent Directory
# mcp:                            # optional: an MCP server YOU host and run, so people can add this to their AI
#   url: https://mcp.example.com/your-skill
#   hosted_by: Your name or company
#   source: https://github.com/you/your-mcp-server   # strongly recommended, for review
# uses: [some-entry-id]           # demos only: the entries this demo shows in action
runtime: t3n                      # t3n (required except for Learn) | other
t3n_features: [tenant-contract]   # which T3N parts it uses: tenant-contract, vault, sealed-maps, http-placeholders, egress-grant, delegation, agent-credits, t3n-sdk
license: MIT                      # optional: SPDX id if open source, or Proprietary
badge: none                       # maintainers set secured-on-t3n after verification
maintainers: ["@your-github-handle"]

# Optional — these appear on your Agent Directory card
business_function: others         # payroll-hr | finance-payments | customer-support | healthcare | insurance | travel-expense | identity-kyc | legal-compliance | others
pain: The problem in one sentence, from the user's side.
protects: What the user's data is protected from.
flow:
  source: Where the sensitive data comes from
  enclave: What the workflow does with it inside the enclave
  agent: What the agent gets back
provider:
  name: Your name or company
  website: https://example.com

# Workflows only — needed for the Secured on T3N badge
contract:
  wit_world: tenant-base
  version: 1.0.0
  wasm_sha256: null               # sha256 of the built .wasm; maintainers rebuild from source and compare

# Agents only
# did: did:t3n:...

added: 2026-01-01                 # today's date
