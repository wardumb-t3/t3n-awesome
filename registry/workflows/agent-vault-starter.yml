id: agent-vault-starter
name: Agent Vault Starter
type: workflow
summary: Lets an AI ask yes/no questions about a customer, like "over 18?" or "KYC verified?", and get only true or false, never the record itself.
url: https://github.com/Terminal-3/agent-vault-starter
pillars: [privacy, credentials]
works_with: [any-t3n-agent]
stack: [rust, wasm]
runtime: t3n
t3n_features: [tenant-contract, sealed-maps]
badge: built-by-t3n
business_function: identity-kyc
pain: Agents need to know facts about a customer, not the customer's raw data.
protects: Raw records stay in the enclave; granted agents only see yes/no answers.
flow:
  source: Customer stores personal records
  enclave: Workflow evaluates the rule
  agent: Gets true / false
provider:
  name: Terminal 3
  website: https://terminal3.io
contract:
  wit_world: agent-vault
  version: 0.1.0
  functions: [store, check, forget]
added: 2026-11-24
