id: safe-flight-booking-muse
name: Safe Flight Booking for Muse
type: demo
summary: Meta's Muse agent books real flights without ever seeing the passport — scanned on the phone, sealed to the user's vault, sent to Duffel from the enclave.
url: https://github.com/wardumb-t3/safe-flight-booking-muse
pillars: [privacy, delegation]
stack: [rust, wasm, node, vite]
runtime: t3n
t3n_features: [tenant-contract, sealed-maps, outbound-http, http-placeholders, t3n-sdk, vault, delegation]
license: MIT
badge: built-by-t3n
business_function: travel-expense
pain: Booking agents need passport data, but nobody wants to hand a passport to an AI.
protects: Passport and contact details never reach the agent, the app or the node operator.
flow:
  source: Passport scanned on the user's phone
  enclave: Flight workflow fills the Duffel booking
  agent: Gets the booking reference only
provider:
  name: Terminal 3
  website: https://terminal3.io
added: 2026-11-24
